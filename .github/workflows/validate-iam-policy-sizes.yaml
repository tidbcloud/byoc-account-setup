name: Validate IAM policy sizes

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/validate-iam-policy-sizes.yaml
      - iam_roles/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checker dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      # With no template arguments the checker inspects every template in
      # iam_roles/, so a newly added template is covered without touching this
      # workflow. The runs below re-measure the parameters that grow a policy.
      - name: Validate default policy sizes
        run: python iam_roles/validate_iam_policy_sizes.py
      - name: Validate multi-region policy sizes
        run: >-
          python iam_roles/validate_iam_policy_sizes.py
          --parameter 'AdditionalO11yHostedZoneIds=arn:aws:route53:::hostedzone/Z111AAA,arn:aws:route53:::hostedzone/Z222BBB'
          --parameter 'AdditionalHostedZoneIds=arn:aws:route53:::hostedzone/Z111AAA,arn:aws:route53:::hostedzone/Z222BBB'
          --parameter 'AdditionalPCAArns=arn:aws:acm-pca:us-west-2:123456789012:certificate-authority/11111111-1111-1111-1111-111111111111,arn:aws:acm-pca:eu-west-1:123456789012:certificate-authority/22222222-2222-2222-2222-222222222222'
      - name: Validate optional node-role policy sizes
        run: >-
          python iam_roles/validate_iam_policy_sizes.py
          --parameter 'EnableExternalDNSNodeRolePolicy=true'
